<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>猜战法 · 三谋猜一猜</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <main class="page">
    <nav class="modes" aria-label="模式">
      <a href="/">经典</a>
      <a href="/daily.html">每日挑战</a>
      <a href="/soup.html">海龟汤</a>
      <a href="/tactic.html" aria-current="page">猜战法</a>
    </nav>
    <header class="top">
      <p class="eyebrow">橙紫通用战法 · 八次机会</p>
      <h1>猜战法</h1>
      <p class="lede">根据品质、类型、效果、登场赛季和发动率，猜出隐藏的战法。</p>
    </header>

    <section class="rules">
      <h2>怎么看反馈</h2>
      <ul>
        <li><span class="swatch correct"></span>完全一致</li>
        <li><span class="swatch close"></span>接近：赛季档相邻，或发动率相差不超过 10 个百分点</li>
        <li><span class="swatch wrong"></span>不一致。箭头表示答案更高或更低</li>
      </ul>
      <p>品质分橙、紫。效果保留兵刃、谋略、辅助、防御、治疗、文武。赛季同样分成 s1、s2、s3、s4+。现有战法的适用兵种都是全兵种，所以没有这一列。</p>
    </section>

    <section class="board-wrap cols-5">
      <div class="board-head" id="boardHead"></div>
      <div id="board" class="board"></div>
      <p id="status" class="status"></p>
      <p id="detail" class="detail" hidden></p>
    </section>

    <form id="guessForm" class="guess-form" autocomplete="off">
      <label class="search">
        <span>猜测战法</span>
        <input id="guessInput" name="tactic" placeholder="输入战法名字" required>
      </label>
      <div id="suggestions" class="suggestions" hidden></div>
      <div class="actions">
        <button type="submit" id="submitGuess">确认</button>
        <button type="button" id="giveUp">查看答案</button>
        <button type="button" id="restart">再来一局</button>
      </div>
    </form>
  </main>
  <script src="/game.js"></script>
  <script src="/tactic.js"></script>
</body>
</html>
