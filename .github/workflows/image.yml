name: Publish image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/pakastaa/sanmou-guess:latest
            ghcr.io/pakastaa/sanmou-guess:${{ github.sha }}
      - name: Make the image public
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          for attempt in 1 2 3 4 5 6; do
            names=$(gh api "/user/packages?package_type=container" --jq '.[].name' || true)
            echo "packages: ${names}"
            name=$(printf '%s\n' "$names" | grep -x 'sanmou-guess' || true)
            if [ -n "$name" ]; then
              gh api --method PATCH \
                -H "Accept: application/vnd.github+json" \
                "/user/packages/container/${name}" \
                -f visibility=public
              exit 0
            fi
            sleep 10
          done
          echo "container package was not visible to this token"
          exit 1
